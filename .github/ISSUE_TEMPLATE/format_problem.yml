name: Format or spec problem
description: The format is ambiguous, the spec is unclear, or a round trip loses data.
labels: ['spec', 'needs-triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is wrong or unclear? Name the section of SPEC.md if it applies.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: An input, the Terset text it gives, and what decode returns.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

name: Bug report
description: The package or the site does something wrong.
labels: ['bug', 'needs-triage']
body:
  - type: input
    id: version
    attributes:
      label: Package and version
      description: Give the package name and version for @stackdeck/terset on npm or terset on PyPI, or say if the bug is on the site.
      placeholder: '@stackdeck/terset 0.3.0 (npm) or terset 0.3.0 (PyPI)'
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Language and runtime version
      description: Give your language and runtime version, or your browser and version for a site bug.
      placeholder: 'Python, CPython 3.12.0'
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input
      description: The smallest input that shows the problem, and the code you ran.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The output or the error.
    validations:
      required: true

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-checks:
    name: Check both packages before publishing either
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Python for version metadata
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Check the tag and both package versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python -B - <<'PY'
          import json
          import os
          from pathlib import Path
          import tomllib

          python_version = tomllib.loads(Path("packages/terset-py/pyproject.toml").read_text())["project"]["version"]
          npm_version = json.loads(Path("packages/terset/package.json").read_text())["version"]
          if python_version != npm_version or os.environ["TAG"] != f"v{python_version}":
              raise SystemExit("Tag, Python version and npm version must match.")
          PY

      - name: Check the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit is not on main."
            exit 1
          fi

      - name: Check npm trusted publishing support
        run: |
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1);
          ' "$(npm --version)"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Gate
        run: pnpm gate

      - name: Build and test the npm package
        run: pnpm --dir packages/terset run prepublishOnly

      - name: Check npm packing
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          pnpm --dir packages/terset pack --pack-destination "$RUNNER_TEMP/pack"

      - name: Set up Python 3.10
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'

      - name: Test, build, check metadata and smoke test the Python wheel
        run: bash .github/scripts/check-python-release.sh

      - name: Strict Python type check
        run: |
          python -m pip install --disable-pip-version-check mypy==1.19.1
          python -B -m mypy --strict --python-version 3.10 --cache-dir "$RUNNER_TEMP/mypy" packages/terset-py/src

  publish:
    name: publish
    needs: release-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # No dependency cache here. A release builds from a clean install.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the npm version
        run: |
          version="$(npm --version)"
          if ! node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)));
            process.exit(ok ? 0 : 1);
          ' "$version"; then
            echo "::error::npm $version is too old. Trusted publishing needs npm 11.5.1 or newer."
            exit 1
          fi
          echo "npm $version"

      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./packages/terset/package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package version v$version."
            exit 1
          fi

      - name: Check the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit is not on main."
            exit 1
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Gate
        run: pnpm gate

      # Same checks as the package's prepublishOnly script.
      - name: Build and test the package
        run: pnpm --dir packages/terset run prepublishOnly

      # pnpm pack applies publishConfig, so the tarball points at dist.
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          pnpm --dir packages/terset pack --pack-destination "$RUNNER_TEMP/pack"

      # Trusted publishing: npm signs in with the workflow's OIDC token. No npm token is used.
      - name: Publish
        run: npm publish "$RUNNER_TEMP"/pack/*.tgz --provenance --access public

  publish-pypi:
    name: Publish Python package
    needs: release-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The shared checks require this exact commit on main and matching versions.
      - name: Set up Python 3.10
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'

      - name: Test, build, check metadata and smoke test the installed wheel
        run: bash .github/scripts/check-python-release.sh

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: ${{ runner.temp }}/terset-python/dist/
          attestations: true

name: Deploy site

# Deploys main on a push, by hand, or after both release packages publish.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    # A manual run from another branch must not reach production.
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # One deploy at a time. The group sits on the job, below the branch check, so a skipped
    # run from another branch never takes the place of a waiting deploy.
    concurrency:
      group: deploy-site
      cancel-in-progress: false
    environment:
      name: site
      url: https://terset.dev
    steps:
      # Always the current tip of main, not the commit that started the run. A rerun of an
      # old run, or runs that finish out of order, then cannot roll the site back.
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # No dependency cache here. A deploy builds from a clean install.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      # Only release completion waits for npm and PyPI propagation (up to two minutes).
      - name: Check the site version is published
        env:
          AFTER_RELEASE: ${{ github.event_name == 'workflow_run' }}
        run: |
          if [ "$AFTER_RELEASE" = "true" ]; then
            node apps/site/scripts/check-published-version.ts --retry
          else
            node apps/site/scripts/check-published-version.ts
          fi

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'

      # The gate builds the site and runs a deploy dry run, so the deploy step uploads a checked build.
      - name: Gate
        run: pnpm gate

      # Only this step sees the Cloudflare token.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
          WRANGLER_SEND_ERROR_REPORTS: 'false'
          WRANGLER_NO_SKILLS_UPDATE_PROMPTS: 'true'
        run: pnpm --dir apps/site run deploy

      - name: Check the live pages
        run: |
          for path in / /format /benchmark /agents /docs; do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' --retry 3 --retry-delay 5 --max-time 20 "https://terset.dev$path")"
            if [ "$code" != "200" ]; then
              echo "::error::https://terset.dev$path returned $code after the deploy."
              exit 1
            fi
            echo "https://terset.dev$path returned 200"
          done
